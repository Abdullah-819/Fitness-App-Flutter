<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A4DFF"/>
      <stop offset="0.5" stop-color="#7F27FF"/>
      <stop offset="1" stop-color="#4B12C4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6D5FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="0" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="0" fill="url(#glow)"/>

  <g transform="translate(512 512) scale(1.0) translate(-512 -512)">
    <!-- soft shadow under the artwork -->
    <g filter="url(#soft)" opacity="0.45">
      <circle cx="512" cy="526" r="315" fill="none" stroke="#1E0560"
              stroke-width="58" stroke-linecap="round"
              stroke-dasharray="1504.19 475.01" transform="rotate(-90 512 526)"/>
    </g>

    <!-- ring track -->
    <circle cx="512" cy="512" r="315" fill="none" stroke="#FFFFFF" stroke-opacity="0.22"
            stroke-width="58"/>

    <!-- ring progress -->
    <circle cx="512" cy="512" r="315" fill="none" stroke="url(#ring)"
            stroke-width="58" stroke-linecap="round"
            stroke-dasharray="1504.19 475.01" transform="rotate(-90 512 512)"/>

    <!-- progress head accent -->
    <circle cx="197.62" cy="492.22" r="19" fill="#7F27FF"/>

    <!-- footprints: left foot lower, right foot higher = walking -->
    <g fill="#FFFFFF">
      <g transform="translate(366 486) rotate(-9 50 100) scale(1.36)"><g transform="translate(100 0) scale(-1 1)">
